connection_drops:
  fields:
    days:
      selector:
        number: {min: 1, max: 365, mode: box, unit_of_measurement: d}
    hours:
      selector:
        number: {min: 1, max: 240, mode: box, unit_of_measurement: h}
    connection:
      selector:
        select:
          options:
            - {label: Native, value: native}
            - {label: PrimeLAN, value: primelan}
    periodic:
      selector:
        boolean:
debug_read_terminals:
  fields:
    start:
      selector:
        number: {min: 0, max: 1009, mode: box}
    end:
      selector:
        number: {min: 0, max: 1009, mode: box}
    only_labelled:
      selector:
        boolean:
debug_watch_terminals:
  fields:
    start:
      selector:
        number: {min: 0, max: 1009, mode: box}
    end:
      selector:
        number: {min: 0, max: 1009, mode: box}
    duration:
      selector:
        number: {min: 1, max: 120, unit_of_measurement: s}
    interval:
      selector:
        number: {min: 0.2, max: 10, step: 0.1, unit_of_measurement: s}
debug_read_memory:
  fields:
    address:
      required: true
      selector:
        number: {min: 0, max: 4294967295, mode: box}
    length:
      selector:
        number: {min: 1, max: 4096, mode: box}
debug_raw_command:
  fields:
    operation:
      required: true
      selector:
        number: {min: 0, max: 255, mode: box}
    data:
      selector:
        text:
debug_memory_diff:
  fields:
    address:
      required: true
      selector:
        number: {min: 0, max: 4294967295, mode: box}
    length:
      required: true
      selector:
        number: {min: 1, max: 262144, mode: box}
    snapshot:
      selector:
        boolean:
    max_changes:
      selector:
        number: {min: 1, max: 2000, mode: box}
debug_write_memory:
  fields:
    address:
      required: true
      selector:
        number: {min: 0, max: 4294967295, mode: box}
    data:
      required: true
      selector:
        text:
    session:
      selector:
        boolean:
debug_probe_commands:
  fields:
    operations:
      required: true
      selector:
        object:
    data:
      selector:
        text:
    response_length:
      selector:
        number: {min: 1, max: 1024, mode: box}
    delay:
      selector:
        number: {min: 0, max: 5, step: 0.1, unit_of_measurement: s}
