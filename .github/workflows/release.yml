name: Release

# Creates a GitHub release (used by HACS) whenever the version in
# manifest.json changes on main and no release with that tag exists yet.
on:
  push:
    branches: [main]
    paths:
      - custom_components/inim_prime/manifest.json
      - RELEASE_NOTES.md
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      republish:
        description: "Ripubblica la versione corrente sull'ultimo codice (cancella e ricrea rilascio e tag)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version custom_components/inim_prime/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          # Alpha/beta/rc (or any version with a hyphen) is a pre-release, so
          # HACS only offers it to users who enabled "Show beta versions".
          PRERELEASE=""
          case "$VERSION" in
            *a[0-9]|*a[0-9][0-9]|*b[0-9]|*b[0-9][0-9]|*rc[0-9]|*rc[0-9][0-9]|*-*)
              PRERELEASE="--prerelease" ;;
          esac
          if [ -z "$PRERELEASE" ] && [ -s RELEASE_NOTES.md ]; then
            # Stable release: the notes are the hand-written RELEASE_NOTES.md.
            cp RELEASE_NOTES.md notes.md
          else
            # Pre-release: commit subjects since the previous release (no links).
            PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
            # Use the previous release only if it is in this branch's history
            # (after a history rewrite it may not be); otherwise just this commit.
            if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null \
               && git merge-base --is-ancestor "refs/tags/$PREV" "$GITHUB_SHA"; then
              RANGE="$PREV..$GITHUB_SHA"
            else
              RANGE="$GITHUB_SHA~1..$GITHUB_SHA"
            fi
            # Skip the version-bump commits ("Release x.y.z ...").
            git log --no-merges --format='- %s' "$RANGE" | grep -v '^- Release [0-9]' > notes.md || true
            [ -s notes.md ] || echo "- Version $VERSION" > notes.md
          fi
          # Manual "republish": move the existing release of this version to
          # the current commit (same number, same notes, fixed code).
          if [ "$REPUBLISH" = "true" ] && gh release view "$VERSION" >/dev/null 2>&1; then
            gh release delete "$VERSION" --yes --cleanup-tag
            echo "Release $VERSION removed, it is recreated below on $GITHUB_SHA"
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            if [ -z "$PRERELEASE" ]; then
              gh release edit "$VERSION" --notes-file notes.md
              echo "Release $VERSION: notes updated"
            else
              echo "Release $VERSION already exists"
            fi
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md $PRERELEASE
          fi
          # HACS installs from this zip ("zip_release" in hacs.json) and reads
          # the download count from it: every release must carry it.
          (cd custom_components/inim_prime && zip -qr "$GITHUB_WORKSPACE/inim_prime.zip" . -x '*__pycache__*')
          gh release upload "$VERSION" inim_prime.zip --clobber
          # A stable release supersedes the betas: remove them and their tags.
          if [ -z "$PRERELEASE" ]; then
            gh release list --limit 100 --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease) | .tagName' | while read -r TAG; do
              gh release delete "$TAG" --yes --cleanup-tag < /dev/null
            done
          fi
