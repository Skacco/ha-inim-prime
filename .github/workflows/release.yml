name: Release

# Creates a GitHub release (used by HACS) whenever the version in
# manifest.json changes on main and no release with that tag exists yet.
on:
  push:
    branches: [main]
    paths:
      - custom_components/inim_prime/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version custom_components/inim_prime/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
